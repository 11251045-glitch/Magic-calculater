<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="計算機">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/iOS_Calculator_icon.png/600px-iOS_Calculator_icon.png">
    <link rel="manifest" href="manifest.json">

    <title>計算機</title>
    <style>
        :root { --ios-orange: #ff9f0a; --ios-gray: #a5a5a5; --ios-dark: #333333; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background-color: black; color: white; margin: 0; height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* 頂部導航 */
        .header { display: flex; justify-content: space-between; padding: 60px 20px 10px; z-index: 1000; }
        .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .icon-btn:active { background: rgba(255,255,255,0.1); }

        /* 選單 Popover (iOS 18 風格) */
        .popover { 
            position: absolute; right: 20px; top: 110px; background: rgba(44, 44, 46, 0.9); 
            backdrop-filter: blur(20px); border-radius: 14px; width: 190px; display: none; 
            flex-direction: column; z-index: 2000; box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            border: 0.5px solid rgba(255,255,255,0.1); overflow: hidden;
        }
        .popover-item { 
            padding: 14px 16px; display: flex; align-items: center; 
            border-bottom: 0.5px solid rgba(255,255,255,0.1); font-size: 17px; 
        }
        .popover-item:active { background: rgba(255,255,255,0.1); }

        /* 顯示螢幕 */
        .display-area { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 30px; text-align: right; }
        #screen { font-size: 90px; font-weight: 300; transition: font-size 0.1s; white-space: nowrap; }
        #convert-label { font-size: 20px; color: #888; margin-bottom: 8px; display: none; }

        /* 按鈕主網格 */
        .button-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 10px 20px 40px; }
        .sci-grid { display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px 10px 40px; }

        /* iOS 18 Liquid Glass 按鈕 */
        .btn { 
            border: none; border-radius: 50%; height: 82px; width: 82px; font-size: 34px; 
            display: flex; align-items: center; justify-content: center; position: relative;
            background: var(--bg); color: var(--color, white); cursor: pointer;
            transition: transform 0.1s ease; overflow: hidden;
        }
        .btn::after {
            content: ""; position: absolute; inset: 0; border-radius: inherit;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            opacity: 0; transform: scale(0.5); transition: opacity 0.3s, transform 0.3s;
        }
        .btn:active { transform: scale(0.92); }
        .btn:active::after { opacity: 1; transform: scale(2); }

        .num { --bg: #333; }
        .tool { --bg: #a5a5a5; --color: black; font-size: 28px; }
        .op { --bg: #ff9f0a; }
        .op.active { --bg: white; --color: #ff9f0a; }
        .sci { --bg: #222; font-size: 18px; height: 62px; width: 62px; border-radius: 31px; }

        .zero { grid-column: span 2; width: 100%; border-radius: 45px; justify-content: flex-start; padding-left: 35px; }

        /* 備忘錄全螢幕 */
        #memo-panel {
            position: fixed; inset: 0; background: black; z-index: 3000; 
            display: none; flex-direction: column; padding-top: 60px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="icon-btn" onclick="showHistory()"><svg width="24" height="24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
    <div class="icon-btn" onclick="toggleMenu()"><svg width="24" height="24" fill="white"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5" fill="#ff9f0a"/></svg></div>
</div>

<div class="popover" id="menu">
    <div class="popover-item" onclick="setMode('basic')">基本</div>
    <div class="popover-item" onclick="setMode('sci')">科學</div>
    <div class="popover-item" onclick="setMode('memo')">數學備忘錄</div>
    <div class="popover-item" onclick="setMode('conv')">換算</div>
</div>

<div class="display-area">
    <div id="convert-label">1 USD = 31.52 TWD</div>
    <div id="screen">0</div>
</div>

<div class="button-grid" id="main-grid">
    <button class="btn tool" id="ac" onclick="clr()">AC</button><button class="btn tool">+/-</button><button class="btn tool">%</button><button class="btn op" id="op-div" onclick="setOp('/')">÷</button>
    <button class="btn num" onclick="press(7)">7</button><button class="btn num" onclick="press(8)">8</button><button class="btn num" onclick="press(9)">9</button><button class="btn op" id="op-mul" onclick="setOp('*')">×</button>
    <button class="btn num" onclick="press(4)">4</button><button class="btn num" onclick="press(5)">5</button><button class="btn num" onclick="press(6)">6</button><button class="btn op" id="op-sub" onclick="setOp('-')">−</button>
    <button class="btn num" onclick="press(1)">1</button><button class="btn num" onclick="press(2)">2</button><button class="btn num" onclick="press(3)">3</button><button class="btn op" id="op-add" onclick="setOp('+')">+</button>
    <button class="btn num zero" onclick="press(0)">0</button><button class="btn num" onclick="addDot()">.</button><button class="btn op" onclick="exec()">=</button>
</div>

<div class="sci-grid" id="sci-grid">
    <button class="btn sci">2nd</button><button class="btn sci">x²</button><button class="btn sci">x³</button><button class="btn sci">eˣ</button><button class="btn sci">sin</button>
    <button class="btn sci">cos</button><button class="btn sci">tan</button><button class="btn sci">ln</button><button class="btn sci">π</button><button class="btn sci" onclick="setMode('basic')" style="--bg:#ff9f0a">返回</button>
</div>

<div id="memo-panel">
    <div style="padding:20px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:24px; font-weight:bold;">數學備忘錄</span>
        <button onclick="closeMemo()" style="background:none; border:none; color:#ff9f0a; font-size:18px;">完成</button>
    </div>
    <div style="padding:20px; color:#888;">這是一個模擬的數學備忘錄介面，您可以在此手寫運算式...</div>
</div>

<script>
    let cur = "0", hist = [], mStep = 0, isWait = false, activeOp = null;

    // --- PWA 註冊 ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }

    // --- UI 切換 ---
    function toggleMenu() {
        const m = document.getElementById('menu');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function setMode(mode) {
        document.getElementById('main-grid').style.display = (mode === 'sci' || mode === 'memo') ? 'none' : 'grid';
        document.getElementById('sci-grid').style.display = (mode === 'sci') ? 'grid' : 'none';
        document.getElementById('convert-label').style.display = (mode === 'conv') ? 'block' : 'none';
        if (mode === 'memo') document.getElementById('memo-panel').style.display = 'flex';
        toggleMenu();
    }

    function closeMemo() { document.getElementById('memo-panel').style.display = 'none'; }

    // --- 計算邏輯 (含魔術) ---
    function update() {
        let f = cur;
        if (!isNaN(cur)) f = Number(cur).toLocaleString('zh-TW', {maximumFractionDigits: 7});
        document.getElementById('screen').innerText = f;
        document.getElementById('ac').innerText = cur === "0" ? "AC" : "C";
        document.getElementById('screen').style.fontSize = f.length > 6 ? (f.length > 9 ? "40px" : "60px") : "90px";
    }

    function press(n) {
        if (isWait) { cur = "0"; isWait = false; }
        if (mStep >= 2) {
            const d = new Date();
            const target = parseInt(`${d.getMonth()+1}${d.getDate()}${d.getHours()}${d.getMinutes().toString().padStart(2,'0')}`);
            cur = (target - hist.reduce((a,b)=>a+b, 0)).toString();
            mStep = 0;
        } else {
            cur = cur === "0" ? n.toString() : cur + n.toString();
        }
        resetOpStyle();
        update();
    }

    function setOp(o) {
        resetOpStyle();
        const id = {'+':'op-add','-':'op-sub','*':'op-mul','/':'op-div'}[o];
        activeOp = document.getElementById(id);
        if (activeOp) activeOp.classList.add('active');
        hist.push(parseFloat(cur));
        mStep++;
        isWait = true;
    }

    function exec() {
        if (hist.length === 0) return;
        let res = hist.reduce((a,b)=>a+b, 0) + parseFloat(cur);
        cur = res.toString();
        hist = []; mStep = 0; resetOpStyle(); update();
    }

    function clr() { cur = "0"; hist = []; mStep = 0; isWait = false; resetOpStyle(); update(); }
    function resetOpStyle() { if(activeOp) activeOp.classList.remove('active'); }
    function addDot() { if(!cur.includes('.')) { cur += '.'; update(); } }

    update();
</script>
</body>
</html>
